name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Apply local submodule patches
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          git -C build-system/bazel-rules/rules_apple apply "$PWD/build-system/patches/rules_apple-unsigned-build.patch"
          git -C third-party/webrtc/webrtc apply "$PWD/build-system/patches/webrtc-compat.patch"

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ hashFiles('versions.json') }}-

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BAZEL_DISK_CACHE="/private/var/tmp/bazel-disk-cache"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_DISK_CACHE" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"

          # Bazel target is still //Telegram:Telegram, so Make.py writes Telegram.ipa.
          # Rename published artifacts to the fork name.
          mv build/artifacts/Telegram.ipa build/artifacts/Naisigram.ipa
          mv build/artifacts/Telegram.DSYMs.zip build/artifacts/Naisigram.DSYMs.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Naisigram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Naisigram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Naisigram.DSYMs.zip
          retention-days: 14

      - name: Create Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "build-${{ env.BUILD_NUMBER }}" --yes 2>/dev/null || true
          gh release create "build-${{ env.BUILD_NUMBER }}" \
            --title "Naisigram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})" \
            --notes "An unsigned (fake-signed) build of Naisigram for iOS/iPadOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}). Re-sign the IPA with AltStore/Sideloadly/ESign before installing on device." \
            /Users/Shared/telegram-ios/build/artifacts/Naisigram.ipa \
            /Users/Shared/telegram-ios/build/artifacts/Naisigram.DSYMs.zip
